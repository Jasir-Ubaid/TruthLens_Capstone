version: '3.8'

services:
  # -------------------------------------------------------------
  # MongoDB Database Service
  # -------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: truthlens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=truthlens_db
    volumes:
      - mongo_data:/data/db
    networks:
      - truthlens-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------
  # FastAPI Backend Service (CV + NLP Orchestrator)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: truthlens-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - DATABASE_NAME=truthlens_db
      - UPLOAD_DIR=/app/backend/uploads
      - STATIC_DIR=/app/backend/static
      - HEATMAP_DIR=/app/backend/static/heatmaps
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - uploads_data:/app/backend/uploads
      - heatmaps_data:/app/backend/static/heatmaps
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - truthlens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------
  # Streamlit Frontend Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: truthlens-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - truthlens-network

networks:
  truthlens-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
  heatmaps_data:
